name: Build original-art offline iOS IPA
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ios-original.yml'
      - 'MapleOriginal-iOS-host-source-v2.zip'
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MAPLE_SERVER_REFERENCE: ${{ github.workspace }}/cosmic
    steps:
      - uses: actions/checkout@v4
        with:
          path: hostrepo
      - uses: actions/checkout@v4
        with:
          repository: tensorfish/openms
          ref: 3e379cfb05beb29ae8413352c8a3345783eb35da
          path: openms
      - uses: actions/checkout@v4
        with:
          repository: P0nk/Cosmic
          ref: fec53bc7714dc0f1ae3f50b2986cdf2727e0912a
          path: cosmic
      - uses: oven-sh/setup-bun@v2
      - name: Prepare iOS tools and simulator
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          unzip -q hostrepo/MapleOriginal-iOS-host-source-v2.zip
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"
      - name: Download actual game data for requested IPA only
        run: |
          curl --fail --location --retry 1 --connect-timeout 20 --max-time 600 -o original-assets.zip http://bucket.openms.dev/Maplestory-Assets.zip
          unzip -q original-assets.zip -d gamefiles -x '__MACOSX/*'
      - name: Validate decoder and input then extract original content
        working-directory: openms
        run: |
          bun install --frozen-lockfile
          bun test client/test/assets.test.js client/test/player-input.test.js
          bun run extract --assets ../gamefiles/Maplestory-Client --maps 100000000,100000001,100000002
      - name: Compile offline runtime and bundle privately inside iOS app
        working-directory: openms
        run: |
          bun -e 'import {buildBrowser} from "./client/tools/browser-build.js"; import {prepareRelease} from "./client/tools/release-manifest.js"; await buildBrowser(console.log); await prepareRelease(process.cwd()+"/client",console.log,{});'
          mkdir -p ../MapleOriginal-iOS/WebContent
          cp client/index.html client/style.css ../MapleOriginal-iOS/WebContent/
          cp -R client/dist ../MapleOriginal-iOS/WebContent/dist
          cp -R client/public/. ../MapleOriginal-iOS/WebContent/
          curl --fail --location -o ../MapleOriginal-iOS/WebContent/OPENMS-LICENSE.txt https://raw.githubusercontent.com/tensorfish/openms/main/LICENSE
          printf '%s' 'OpenMS source: https://github.com/tensorfish/openms/tree/3e379cfb05beb29ae8413352c8a3345783eb35da ; GPL-3.0-or-later. iOS host source: use3099/-ms079-ios. Original game assets retain their respective ownership.' > ../MapleOriginal-iOS/WebContent/SOURCE-NOTICE.txt
          du -sh ../MapleOriginal-iOS/WebContent
      - name: Generate Xcode project and compile simulator app
        working-directory: MapleOriginal-iOS
        run: |
          xcodegen generate
          xcodebuild build -project MapleOriginal.xcodeproj -scheme MapleOriginal -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath sim-build CODE_SIGNING_ALLOWED=NO
      - name: Install and launch real client in iPhone simulator
        working-directory: MapleOriginal-iOS
        run: |
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" sim-build/Build/Products/Debug-iphonesimulator/MapleOriginal.app
          xcrun simctl launch "$DEVICE_ID" com.use3099.mapleoriginal
          APP_DATA=$(xcrun simctl get_app_container "$DEVICE_ID" com.use3099.mapleoriginal data)
          READY=0
          for attempt in $(seq 1 100); do
            if [ -f "$APP_DATA/Documents/port-check.json" ]; then
              cp "$APP_DATA/Documents/port-check.json" ../ios-runtime-check.json
              if python3 -c 'import json,sys; sys.exit(0 if json.load(open("../ios-runtime-check.json")).get("ready") else 1)'; then READY=1; fi
              break
            fi
            sleep 3
          done
          xcrun simctl io "$DEVICE_ID" screenshot ../ios-original-preview.png
          test "$READY" = 1
      - name: Compile and package unsigned device IPA
        working-directory: MapleOriginal-iOS
        run: |
          xcodebuild build -project MapleOriginal.xcodeproj -scheme MapleOriginal -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath device-build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' CURRENT_PROJECT_VERSION=${{ github.run_number }}
          mkdir -p ../ipa-output/Payload
          cp -R device-build/Build/Products/Release-iphoneos/MapleOriginal.app ../ipa-output/Payload/
          lipo ../ipa-output/Payload/MapleOriginal.app/MapleOriginal -verify_arch arm64
          cd ../ipa-output
          ditto -c -k --keepParent Payload MapleOriginal-unsigned.ipa
          shasum -a 256 MapleOriginal-unsigned.ipa > SHA256SUMS.txt
          ls -lh MapleOriginal-unsigned.ipa
      - name: Upload requested IPA only, not a web asset distribution
        uses: actions/upload-artifact@v4
        with:
          name: MapleOriginal-iOS-unsigned
          path: |
            ipa-output/MapleOriginal-unsigned.ipa
            ipa-output/SHA256SUMS.txt
            ios-runtime-check.json
            ios-original-preview.png
          if-no-files-found: error
      - name: Retain failure metadata and preview only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: original-ios-diagnostics
          path: |
            ios-runtime-check.json
            ios-original-preview.png
            openms/client/.cache/extraction/**/preflight.json
          if-no-files-found: ignore
