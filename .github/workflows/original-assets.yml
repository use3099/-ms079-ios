name: Verify original WZ asset package
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/original-assets.yml']
permissions:
  contents: read
jobs:
  resources:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download original WZ package referenced by OpenMS
        run: |
          mkdir -p report
          curl --fail --location --retry 1 --connect-timeout 20 --max-time 600 --max-filesize 10000000000 --output original-assets.zip http://bucket.openms.dev/Maplestory-Assets.zip
      - name: Verify actual WZ data and inventory
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,json,hashlib
          p=Path('original-assets.zip')
          assert zipfile.is_zipfile(p), 'Download is not a ZIP archive'
          rows=[]
          with zipfile.ZipFile(p) as z:
              for x in z.infolist():
                  if x.filename.lower().endswith('.wz') and not x.filename.startswith('__MACOSX/'):
                      with z.open(x) as f:
                          magic=f.read(4)
                      rows.append({'path':x.filename,'bytes':x.file_size,'header':magic.hex(),'valid_wz':magic==b'PKG1'})
              ui=[r for r in rows if Path(r['path']).name.lower()=='ui.wz']
              assert ui and ui[0]['valid_wz'], 'No real UI.wz present'
              required=['Character.wz','Map.wz','Mob.wz','Npc.wz','Sound.wz']
              for name in required:
                  assert any(Path(r['path']).name==name and r['valid_wz'] for r in rows), 'Missing '+name
          report={'source':'OpenMS README asset package','zip_bytes':p.stat().st_size,'wz_files':rows,'ui_found':True,'version_match_to_wasm_ui':False,'ios_play_tested':False}
          Path('report/wz-inventory.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - name: Upload inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-wz-inventory
          path: report/
          if-no-files-found: ignore
