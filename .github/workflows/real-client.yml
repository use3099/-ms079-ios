name: Real MapleStory client and asset validation
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/real-client.yml']
permissions:
  contents: read
jobs:
  client:
    name: Compile real upstream MapleStory client
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: nmnsnv/maplestory-wasm
          ref: 9eef4c730ff5639089eeccae51bf6266c878c30c
      - name: Build actual C++ client through upstream Docker workflow
        run: bash scripts/docker_build_wasm.sh --jobs 4
      - name: Verify WebAssembly binary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('build/JourneyClient.wasm')
          assert p.read_bytes()[:8] == bytes([0,97,115,109,1,0,0,0])
          assert Path('build/JourneyClient.js').stat().st_size > 1000
          report={'upstream':'nmnsnv/maplestory-wasm','commit':'9eef4c730ff5639089eeccae51bf6266c878c30c','wasm_bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'ios_tested':False,'assets_included':False}
          Path('verification.json').write_text(json.dumps(report,indent=2))
          print(report)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: real-maplestory-wasm-client
          path: |
            build/JourneyClient.js
            build/JourneyClient.wasm
            verification.json
            LICENSE
          if-no-files-found: error
